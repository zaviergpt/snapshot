<!DOCTYPE html>
<html>
    <head>
        <title>Contact Us - Snapshot</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./stylesheets/contact-us.css" type="text/css">
        <link rel="stylesheet" href="./stylesheets/theme.css" type="text/css">
        <script src="./scripts/theme.js" type="text/javascript"></script>
    </head>
    <body>
        <nav id="navigation">
            <div>
                <ul>
                    <li><a href="./home.html">home</a></li>
                    <li><a href="./showcase.html">showcase</a></li>
                    <li><a href="./about-us.html">about us</a></li>
                </ul>
                <h1 class="logo">snapshot</h1>
                <button id="navigation-toggle">
                    <img src="./media/icons/bars-solid-full.svg">
                </button>
            </div>
        </nav>
        <div class="contact-container">
            <form class="contact-form" action="./success.html">
                <h1>contact us</h1>
                <div class="row">
                    <div style="width: 50%">
                        <label>first name</label>
                        <input type="text" placeholder="first name" name="firstName" required autocomplete="off">
                    </div>
                    <div style="width: 50%">
                        <label>Last Name</label>
                        <input type="text" placeholder="last name" name="lastName" required autocomplete="off">
                    </div>
                </div>
                <div class="row">
                    <div style="width: 20%">
                        <label>Age</label>
                        <input type="number" placeholder="age" min="0" max="120" name="age" required autocomplete="off">
                    </div>
                    <div style="width: 80%">
                        <label>Email</label>
                        <input type="email" placeholder="email" name="email" required autocomplete="off">
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px">
                    <label>Why do you want to join Snapshot?</label>
                    <textarea placeholder="my answer" name="myAnswer" required></textarea>
                </div>
                <button>Submit</button>
            </form>
        </div>
        <footer>
            <table>
                <thead>
                    <tr>
                        <th>Site links</th>
                        <th>Others</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><a href="/home.html">Home</a></td>

                    </tr>
                    <tr>
                        <td><a href="/showcase.html">Showcase</a></td>
                        <td><a href="https://zaviergpt.github.io">zaviergpt's GitHub</a></td>
                    </tr>
                    <tr>
                        <td><a href="/about-us.html">About Us</a></td>
                    </tr>
                    <tr>
                        <td><a href="/contact-us.html">Contact Us</a></td>
                    </tr>
                </tbody>
            </table>
        </footer>
    </body>
</html>
